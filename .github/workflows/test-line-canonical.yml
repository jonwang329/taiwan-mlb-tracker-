name: Test LINE canonical notifier

on:
  pull_request:
    paths:
      - 'cloudflare/line-canonical-worker.js'
      - 'cloudflare/line-worker-single-cron.js'
      - 'scripts/line-canonical-worker.test.mjs'
      - '.github/workflows/test-line-canonical.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/line-canonical-worker.test.mjs
