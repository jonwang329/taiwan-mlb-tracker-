# Eddie V3 scheduling sandbox deploy
name: Eddie LINE sandbox deploy

on:
  push:
    branches: [eddie-line-sandbox]
    paths:
      - '.github/workflows/eddie-line-smoke-test.yml'
      - 'cloudflare/eddie-sandbox-worker-v3.js'
      - 'cloudflare/eddie-scheduling-core.mjs'
      - 'cloudflare/eddie-regression-test.mjs'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Eddie scheduling regression gate
        run: |
          node cloudflare/eddie-regression-test.mjs

      - name: Verify Worker syntax
        run: |
          node --check cloudflare/eddie-sandbox-worker-v3.js

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"

      - name: Deploy isolated Eddie Worker V3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save wrangler@4
          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="eddie-line-sandbox") | .id' | head -1)
          test -n "$namespace_id" && test "$namespace_id" != "null"
          cat > wrangler.eddie.toml <<EOF
          name = "eddie-line-sandbox"
          main = "cloudflare/eddie-sandbox-worker-v3.js"
          compatibility_date = "2026-08-16"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true
          keep_vars = true
          [[kv_namespaces]]
          binding = "EDDIE_KV"
          id = "$namespace_id"
          EOF
          npx wrangler deploy --config wrangler.eddie.toml

      - name: Verify Eddie V3 health and frozen core
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          for attempt in $(seq 1 10); do
            health=$(curl -sS "$URL/health" || true)
            echo "attempt $attempt health=$health"
            if echo "$health" | jq -e '.ok == true and .confirmMode == "native-form" and .linePushPolicy == "offer-only" and .coreVersion == "v3" and .regression.ok == true' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Verify LINE webhook remains active
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          config=$(curl -fsS "$URL/line-webhook-config")
          echo "$config" | jq .
          echo "$config" | jq -e '.active == true and .endpointMatchesExpected == true' >/dev/null

      - name: Verify dashboard uses shared week
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          state=$(curl -fsS "$URL/api/dashboard")
          echo "$state" | jq '{core,linePushPolicy,studentCount:(.students|length),confirmedSlots:(.week.confirmed|length),heldSlots:(.week.holds|length)}'
          echo "$state" | jq -e '.core == "student-module-shared-week-v3" and (.students|length) > 0 and (.week.confirmed|type) == "object" and (.week.holds|type) == "object"' >/dev/null
