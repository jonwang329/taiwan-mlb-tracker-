# Eddie E2E scheduling sandbox
name: Eddie LINE sandbox deploy

on:
  push:
    branches: [eddie-line-sandbox]
    paths:
      - '.github/workflows/eddie-line-smoke-test.yml'
      - 'cloudflare/eddie-sandbox-worker.js'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"

      - name: Deploy isolated Eddie Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save wrangler@4
          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="eddie-line-sandbox") | .id' | head -1)
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            npx wrangler kv namespace create eddie-line-sandbox
            namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="eddie-line-sandbox") | .id' | head -1)
          fi
          test -n "$namespace_id" && test "$namespace_id" != "null"

          deploy_nonce=$(openssl rand -hex 24)
          echo "EDDIE_DEPLOY_NONCE=$deploy_nonce" >> "$GITHUB_ENV"

          cat > wrangler.eddie.toml <<EOF
          name = "eddie-line-sandbox"
          main = "cloudflare/eddie-sandbox-worker.js"
          compatibility_date = "2026-08-16"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true
          keep_vars = true

          [vars]
          EDDIE_TEST_ID = "live-test"
          EDDIE_DEPLOY_NONCE = "$deploy_nonce"

          [[kv_namespaces]]
          binding = "EDDIE_KV"
          id = "$namespace_id"
          EOF

          npx wrangler deploy --config wrangler.eddie.toml

      - name: Verify Eddie Worker health
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          for attempt in $(seq 1 10); do
            health=$(curl -sS "$URL/health" || true)
            echo "attempt $attempt health=$health"
            if echo "$health" | jq -e '.ok == true and .deployNonceConfigured == true and .confirmMode == "native-form"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify LINE webhook remains active
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          config=$(curl -fsS "$URL/line-webhook-config")
          echo "$config" | jq .
          echo "$config" | jq -e '.active == true and .endpointMatchesExpected == true' >/dev/null

      - name: Verify second LINE user is separate from coach
        if: github.event.head_commit.message == 'Test Kevin scheduling separation'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="eddie-line-sandbox") | .id' | head -1)
          latest=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$namespace_id/values/line%3Alatest-user")
          coach=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$namespace_id/values/line%3Acoach-user")
          echo "$latest" | jq '{latestDisplayName:.displayName,status:.status,userIdPresent:(.userId|length>0)}'
          echo "$coach" | jq '{coachDisplayName:.displayName,userIdPresent:(.userId|length>0)}'
          latest_id=$(echo "$latest" | jq -r '.userId')
          coach_id=$(echo "$coach" | jq -r '.userId')
          test -n "$latest_id" && test -n "$coach_id"
          if [ "$latest_id" = "$coach_id" ]; then
            echo "LATEST_USER_IS_STILL_COACH"
            exit 1
          fi
          echo "SECOND_USER_SEPARATED_FROM_COACH=true"

      - name: Send scheduling test only to second user
        if: github.event.head_commit.message == 'Test Kevin scheduling separation'
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          result=$(curl -fsS -X POST \
            -H "x-eddie-deploy-nonce: $EDDIE_DEPLOY_NONCE" \
            "$URL/internal/send-demo")
          echo "$result" | jq '{ok,recipient,offerCount,lineStatus}'
          echo "$result" | jq -e '.ok == true and .offerCount == 2 and .lineStatus >= 200 and .lineStatus < 300' >/dev/null

      - name: Verify coach remains paired and second user is Offered
        if: github.event.head_commit.message == 'Test Kevin scheduling separation'
        run: |
          URL="https://eddie-line-sandbox.jonwang329.workers.dev"
          state=$(curl -fsS "$URL/coach-status")
          echo "$state" | jq .
          echo "$state" | jq -e '.status == "offered" and (.offers|length) == 2 and .coachPaired == true' >/dev/null
