name: Observation list manager

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      (startsWith(github.event.issue.title, '[watchlist:add]') || startsWith(github.event.issue.title, '[watchlist:remove]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Parse approved request
        id: request
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" =~ ^\[watchlist:(add|remove)\][[:space:]]playerId=([0-9]+)$ ]]; then
            echo "action=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "player_id=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid watchlist request format"
            exit 1
          fi
      - name: Validate MLB player and update shared list
        env:
          WATCHLIST_ACTION: ${{ steps.request.outputs.action }}
          PLAYER_ID: ${{ steps.request.outputs.player_id }}
        run: node scripts/manage-watchlist.mjs
      - name: Commit shared observation list
        env:
          ACTION: ${{ steps.request.outputs.action }}
          PLAYER_ID: ${{ steps.request.outputs.player_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracked-players.json
          git commit -m "${ACTION^} tracked MLB player ${PLAYER_ID}"
          git push origin main
      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ steps.request.outputs.action }}
          PLAYER_ID: ${{ steps.request.outputs.player_id }}
        run: |
          gh issue comment "$ISSUE" --body "✅ Observation list updated: **$ACTION** MLB player ID **$PLAYER_ID**. The dashboard and future LINE reports now read the same shared list."
          gh issue close "$ISSUE" --reason completed
