name: Observation list manager

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      (startsWith(github.event.issue.title, '[watchlist:add]') || startsWith(github.event.issue.title, '[watchlist:remove]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse approved request
        id: request
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" =~ ^\[watchlist:(add|remove)\][[:space:]]playerId=([0-9]+)$ ]]; then
            echo "action=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "player_id=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid watchlist request format"
            exit 1
          fi
      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Load current observation list
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="taiwan-mlb-observation-list") | .id' | head -1)
          test -n "$namespace_id" && test "$namespace_id" != "null" || { echo "::error::KV namespace taiwan-mlb-observation-list not found; deploy the observation Worker first"; exit 1; }
          echo "namespace_id=$namespace_id" >> "$GITHUB_OUTPUT"
          if ! npx wrangler kv key get --namespace-id "$namespace_id" players --text --remote > /tmp/players.json 2>/dev/null || [ ! -s /tmp/players.json ]; then
            cp tracked-players.json /tmp/players.json
          fi
      - name: Validate MLB player and prepare updated list
        env:
          WATCHLIST_ACTION: ${{ steps.request.outputs.action }}
          PLAYER_ID: ${{ steps.request.outputs.player_id }}
          WATCHLIST_INPUT: /tmp/players.json
          WATCHLIST_OUTPUT: /tmp/players-updated.json
        run: node scripts/manage-watchlist.mjs
      - name: Write updated list to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        run: npx wrangler kv key put --namespace-id "$NAMESPACE_ID" players --path /tmp/players-updated.json --remote
      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ steps.request.outputs.action }}
          PLAYER_ID: ${{ steps.request.outputs.player_id }}
        run: |
          gh issue comment "$ISSUE" --body "✅ Observation list updated in Cloudflare KV: **$ACTION** MLB player ID **$PLAYER_ID**. The dashboard and future LINE reports now read the same shared list."
          gh issue close "$ISSUE" --reason completed
