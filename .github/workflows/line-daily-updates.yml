name: LINE daily tracker updates

on:
  schedule:
    # GitHub cron uses UTC; these are 07:00, 08:00, 09:00 and 12:00 in Asia/Taipei (UTC+8).
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Notification type
        required: true
        default: summary
        type: choice
        options: [summary, changes]

permissions:
  contents: read

concurrency:
  group: line-daily-tracker
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore the last successful tracker snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: line-tracker-state-
      - name: Choose notification type
        id: notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$MANUAL_MODE"
          elif [[ "$SCHEDULE" == "0 4 * * *" ]]; then
            mode="summary"
          else
            mode="changes"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Fetch tracker data and notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-update.mjs --mode=${{ steps.notification.outputs.mode }}
      - name: Save tracker snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
