name: LINE daily tracker updates

on:
  schedule:
    # Four explicit Taiwan-time runs. Minute 7 avoids the top-of-hour Actions load spike.
    - cron: "7 7 * * *"
      timezone: "Asia/Taipei"
    - cron: "7 8 * * *"
      timezone: "Asia/Taipei"
    - cron: "7 9 * * *"
      timezone: "Asia/Taipei"
    - cron: "7 12 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      mode:
        description: Manual TEST report type
        required: true
        default: final
        type: choice
        options: [morning, changes, final]

permissions:
  contents: read

concurrency:
  group: line-daily-tracker
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Taiwan notification window
        id: notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          test_flag=""
          slot=""
          active="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$MANUAL_MODE"
            test_flag="--test"
            active="true"
          else
            case "$EVENT_SCHEDULE" in
              "7 7 * * *")  mode="morning"; slot="07"; active="true" ;;
              "7 8 * * *")  mode="changes"; slot="08"; active="true" ;;
              "7 9 * * *")  mode="changes"; slot="09"; active="true" ;;
              "7 12 * * *") mode="final"; slot="12"; active="true" ;;
              *)              mode="skip" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "test_flag=$test_flag" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Taiwan time: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z'); schedule=${EVENT_SCHEDULE:-manual}; mode=$mode; slot=${slot:-manual}; active=$active"

      - name: Load observation API URL
        if: steps.notification.outputs.active == 'true'
        run: |
          api_url=$(sed -n "s/.*OBSERVATION_API_URL = '\(.*\)';.*/\1/p" observation-config.js | head -1)
          if [ -n "$api_url" ]; then
            echo "OBSERVATION_API_URL=$api_url" >> "$GITHUB_ENV"
            echo "Observation API configured from observation-config.js"
          else
            echo "Observation API is not deployed yet; tracked-players.json fallback will be used"
          fi

      - name: Verify LINE configuration
        if: steps.notification.outputs.active == 'true'
        env:
          HAS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' }}
          HAS_DESTINATION: ${{ secrets.LINE_DESTINATION_ID != '' || secrets.LINE_USER_ID != '' }}
        run: |
          echo "LINE token configured: $HAS_TOKEN; destination configured: $HAS_DESTINATION"
          [[ "$HAS_TOKEN" == "true" ]] || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN is not configured"; exit 1; }
          [[ "$HAS_DESTINATION" == "true" ]] || { echo "::error::LINE_DESTINATION_ID or LINE_USER_ID is not configured"; exit 1; }

      - name: Restore the last successful tracker snapshot
        if: steps.notification.outputs.active == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: line-tracker-state-

      - name: Fetch tracker data and notify LINE
        if: steps.notification.outputs.active == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION_ID: ${{ secrets.LINE_DESTINATION_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFICATION_SLOT: ${{ steps.notification.outputs.slot }}
        run: node scripts/send-line-update.mjs --mode=${{ steps.notification.outputs.mode }} ${{ steps.notification.outputs.test_flag }}

      - name: Save tracker snapshot
        if: success() && steps.notification.outputs.active == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
