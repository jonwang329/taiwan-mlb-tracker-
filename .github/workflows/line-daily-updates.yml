name: LINE daily tracker updates

on:
  schedule:
    # GitHub cron is always UTC. 23:00 UTC is 07:00 Asia/Taipei on the following day.
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Notification type
        required: true
        default: final
        type: choice
        options: [morning, changes, final]

permissions:
  contents: read

concurrency:
  group: line-daily-tracker
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log schedule and configuration preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          HAS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' }}
          HAS_DESTINATION: ${{ secrets.LINE_DESTINATION_ID != '' || secrets.LINE_USER_ID != '' }}
        run: |
          echo "Event: $EVENT_NAME; cron: ${SCHEDULE:-manual}"
          echo "Started UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Started Taiwan: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "LINE token configured: $HAS_TOKEN; destination configured: $HAS_DESTINATION"
          [[ "$HAS_TOKEN" == "true" ]] || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN is not configured"; exit 1; }
          [[ "$HAS_DESTINATION" == "true" ]] || { echo "::error::LINE_DESTINATION_ID or LINE_USER_ID is not configured"; exit 1; }
      - name: Restore the last successful tracker snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: line-tracker-state-
      - name: Choose notification type
        id: notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$MANUAL_MODE"
          elif [[ "$SCHEDULE" == "0 23 * * *" ]]; then
            mode="morning"
          elif [[ "$SCHEDULE" == "0 4 * * *" ]]; then
            mode="final"
          else
            mode="changes"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Fetch tracker data and notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION_ID: ${{ secrets.LINE_DESTINATION_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-update.mjs --mode=${{ steps.notification.outputs.mode }}
      - name: Save tracker snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
