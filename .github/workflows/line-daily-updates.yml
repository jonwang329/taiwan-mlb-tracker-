name: LINE daily tracker updates

on:
  schedule:
    - cron: '0 23 * * *' # 07:00 Asia/Taipei
    - cron: '0 0 * * *'  # 08:00 Asia/Taipei
    - cron: '0 1 * * *'  # 09:00 Asia/Taipei
    - cron: '0 4 * * *'  # 12:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      slot:
        description: Manual test slot / format
        required: true
        default: '08:00'
        type: choice
        options: ['07:00', '08:00', '09:00', '12:00']

permissions:
  contents: read

concurrency:
  group: line-tracker-${{ github.event_name }}-${{ github.event.schedule || inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load observation API URL
        run: |
          api_url=$(sed -n "s/.*OBSERVATION_API_URL = '\(.*\)';.*/\1/p" observation-config.js | head -1)
          if [ -n "$api_url" ]; then
            echo "OBSERVATION_API_URL=$api_url" >> "$GITHUB_ENV"
            echo "Observation API configured from observation-config.js"
          else
            echo "Observation API is not deployed; tracked-players.json is used only as the player-name list"
          fi

      - name: Verify LINE configuration
        env:
          HAS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' }}
          HAS_DESTINATION: ${{ secrets.LINE_DESTINATION_ID != '' || secrets.LINE_USER_ID != '' }}
        run: |
          echo "LINE token configured: $HAS_TOKEN; destination configured: $HAS_DESTINATION"
          [[ "$HAS_TOKEN" == "true" ]] || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN is not configured"; exit 1; }
          [[ "$HAS_DESTINATION" == "true" ]] || { echo "::error::LINE_DESTINATION_ID or LINE_USER_ID is not configured"; exit 1; }

      - name: Resolve Taiwan notification slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slot="${{ inputs.slot }}"
            echo "LINE_TEST_ARG=--test" >> "$GITHUB_ENV"
            echo "NOTIFICATION_SLOT=$slot" >> "$GITHUB_ENV"
            echo "Resolved manual test slot: $slot"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            '0 23 * * *') slot='07:00' ;;
            '0 0 * * *')  slot='08:00' ;;
            '0 1 * * *')  slot='09:00' ;;
            '0 4 * * *')  slot='12:00' ;;
            *) echo "::error::Unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
          esac
          echo "LINE_TEST_ARG=" >> "$GITHUB_ENV"
          echo "NOTIFICATION_SLOT=$slot" >> "$GITHUB_ENV"
          echo "Resolved scheduled Taiwan slot: $slot"

      - name: Fetch official MLB data and send one LINE message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION_ID: ${{ secrets.LINE_DESTINATION_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-update.mjs --slot="$NOTIFICATION_SLOT" $LINE_TEST_ARG
