name: Probe official MLB batch endpoints

on:
  push:
    branches: [agent/cloudflare-line-worker]
    paths:
      - '.github/workflows/probe-mlb-batch.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official MLB batch parameters
        run: |
          node <<'NODE'
          const base='https://statsapi.mlb.com/api/v1';
          const ids='829473,701678';
          async function get(url){
            const r=await fetch(url,{headers:{Accept:'application/json'}});
            const text=await r.text();
            console.log(`STATUS ${r.status} ${url}`);
            if(!r.ok){ console.log(text.slice(0,500)); return null; }
            try{return JSON.parse(text);}catch{return null;}
          }
          const people=await get(`${base}/people?personIds=${ids}&hydrate=currentTeam`);
          const compact=(people?.people||[]).map(p=>({id:p.id,name:p.fullName,currentTeam:p.currentTeam}));
          console.log('PEOPLE', JSON.stringify(compact,null,2));
          const teamIds=compact.map(p=>p.currentTeam?.id).filter(Boolean).join(',');
          if(!teamIds) throw new Error('currentTeam ids missing');
          const teams=await get(`${base}/teams?teamIds=${teamIds}`);
          console.log('TEAMS', JSON.stringify((teams?.teams||[]).map(t=>({id:t.id,name:t.name,sport:t.sport,parentOrgId:t.parentOrgId})),null,2));
          const schedule=await get(`${base}/schedule?teamId=${teamIds}&sportId=1,11,12,13,14,16&startDate=2026-08-11&endDate=2026-08-12`);
          console.log('BATCH_SCHEDULE_GAMES', JSON.stringify((schedule?.dates||[]).flatMap(d=>d.games||[]).map(g=>({gamePk:g.gamePk,gameDate:g.gameDate,status:g.status,away:g.teams?.away?.team,home:g.teams?.home?.team})).slice(0,10),null,2));
          NODE
