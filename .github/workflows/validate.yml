name: Validate tracker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        run: |
          node --check taiwan-game-time.js
          node --check app.js
          node --check snapshot-bootstrap.js
          node --check mlb-fetch-guard.js
          node --check watchlist-manager.js
          node --check cloudflare/observation-worker.js
          node --check cloudflare/line-worker.js
          node --check scripts/build-dashboard-snapshot.mjs
          node --check scripts/send-line-update.mjs
          node --check scripts/shared-tracker-data.mjs
          node --check scripts/manage-watchlist.mjs
      - name: Automation tests
        run: node --test scripts/automation.test.mjs scripts/dashboard-snapshot.test.mjs scripts/taiwan-game-time.test.mjs scripts/schedule-query.test.mjs scripts/line-content.test.mjs
