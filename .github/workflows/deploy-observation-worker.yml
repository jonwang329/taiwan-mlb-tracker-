# Deployment trigger: 2026-08-12
name: Deploy observation Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/observation-worker.js'
      - '.github/workflows/deploy-observation-worker.yml'
      - 'tracked-players.json'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare and LINE secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION: ${{ secrets.LINE_DESTINATION_ID || secrets.LINE_USER_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$LINE_TOKEN" || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$LINE_DESTINATION" || { echo "::error::LINE_DESTINATION_ID or LINE_USER_ID is missing"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Resolve or create KV namespace and deploy Worker with LINE cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="taiwan-mlb-observation-list") | .id' | head -1)
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            npx wrangler kv namespace create taiwan-mlb-observation-list
            namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="taiwan-mlb-observation-list") | .id' | head -1)
          fi
          test -n "$namespace_id" && test "$namespace_id" != "null" || { echo "::error::Could not resolve KV namespace"; exit 1; }

          if ! npx wrangler kv key get --namespace-id "$namespace_id" players --text --remote >/tmp/current-players.json 2>/dev/null || [ ! -s /tmp/current-players.json ]; then
            npx wrangler kv key put --namespace-id "$namespace_id" players --path tracked-players.json --remote
          fi

          cat > wrangler.deploy.toml <<EOF
          name = "taiwan-mlb-observation-list"
          main = "cloudflare/observation-worker.js"
          compatibility_date = "2026-08-12"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true

          [[kv_namespaces]]
          binding = "OBSERVATION_LIST"
          id = "$namespace_id"

          [triggers]
          crons = ["0 23 * * *", "0 0 * * *", "0 1 * * *", "0 4 * * *"]
          EOF
          npx wrangler deploy --config wrangler.deploy.toml
      - name: Install LINE secrets in Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION: ${{ secrets.LINE_DESTINATION_ID || secrets.LINE_USER_ID }}
          DEPLOY_TEST_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$LINE_TOKEN" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --config wrangler.deploy.toml
          printf '%s' "$LINE_DESTINATION" | npx wrangler secret put LINE_DESTINATION_ID --config wrangler.deploy.toml
          printf '%s' "$DEPLOY_TEST_TOKEN" | npx wrangler secret put DEPLOY_TEST_TOKEN --config wrangler.deploy.toml
      - name: Set workers.dev URL and verify health
        id: worker
        run: |
          url="https://taiwan-mlb-observation-list.jonwang329.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          health=""
          for attempt in $(seq 1 15); do
            health=$(curl -fsS "$url/health" || true)
            if echo "$health" | jq -e '.ok == true and .lineScheduler == true and .lineConfigured == true' >/dev/null 2>&1; then
              echo "Cloudflare Worker health ready on attempt $attempt"
              echo "$health" | jq '{ok,lineScheduler,lineConfigured,cronTimezone}'
              exit 0
            fi
            echo "Worker version/secrets not ready yet (attempt $attempt/15)"
            sleep 2
          done
          echo "::error::Cloudflare Worker did not report LINE readiness after retries"
          echo "$health" | jq '{ok,lineScheduler,lineConfigured,cronTimezone}' 2>/dev/null || true
          exit 1
      - name: Send Cloudflare to LINE deployment test
        env:
          URL: ${{ steps.worker.outputs.url }}
          DEPLOY_TEST_TOKEN: ${{ github.token }}
        run: |
          result=""
          for attempt in $(seq 1 5); do
            if result=$(curl --fail-with-body --max-time 150 -sS -X POST "$URL/internal/line-test" -H "Authorization: Bearer $DEPLOY_TEST_TOKEN"); then
              if echo "$result" | jq -e '.ok == true and .lineStatus == 200' >/dev/null 2>&1; then
                echo "$result" | jq '{ok,lineStatus,date,players,active}'
                echo "Cloudflare -> LINE test succeeded"
                exit 0
              fi
            fi
            echo "Cloudflare -> LINE test not ready (attempt $attempt/5)"
            sleep 2
          done
          echo "::error::Cloudflare -> LINE deployment test failed"
          echo "$result" | jq '{ok,error,lineStatus,date,players,active}' 2>/dev/null || true
          exit 1
      - name: Configure dashboard and automation API URL
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          printf "// Generated by Deploy observation Worker.\nwindow.OBSERVATION_API_URL = '%s';\n" "$URL" > observation-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observation-config.js
          if git diff --cached --quiet; then
            echo "Dashboard API URL already current"
          else
            git commit -m "Configure deployed observation Worker URL"
            git push origin HEAD:main
          fi
      - name: Verify shared list
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          curl -fsS "$URL/players" | jq -e '.players | length > 0'
          echo "Observation API: $URL"
          echo "LINE scheduler now runs in Cloudflare at 07:00, 08:00, 09:00, 12:00 Asia/Taipei"
