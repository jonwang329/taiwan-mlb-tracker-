# Deployment trigger: 2026-08-17
# The legacy /internal/line-test endpoint remains available for manual diagnosis; deployment never calls it.
name: Deploy observation Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/observation-worker.js'
      - 'cloudflare/observation-worker-safe.js'
      - 'cloudflare/line-worker.js'
      - 'cloudflare/line-flex-worker.js'
      - 'cloudflare/line-worker-single-cron.js'
      - '.github/workflows/deploy-observation-worker.yml'
      - 'tracked-players.json'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare and LINE secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION: ${{ secrets.LINE_DESTINATION_ID || secrets.LINE_USER_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$LINE_TOKEN" || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$LINE_DESTINATION" || { echo "::error::LINE_DESTINATION_ID or LINE_USER_ID is missing"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Resolve KV and deploy observation + LINE workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          if [ -n "$OWNER_PASSWORD" ]; then
            owner_hash=$(printf '%s' "$OWNER_PASSWORD" | sha256sum | awk '{print $1}')
            sed -Ei "s/const OWNER_KEY_SHA256 = '[a-f0-9]{64}';/const OWNER_KEY_SHA256 = '$owner_hash';/" cloudflare/observation-worker.js
            grep -Eq "const OWNER_KEY_SHA256 = '[a-f0-9]{64}';" cloudflare/observation-worker.js || { echo "::error::Could not install OWNER_PASSWORD hash"; exit 1; }
            echo "Custom OWNER_PASSWORD hash installed for observation Worker"
          else
            echo "OWNER_PASSWORD not set; keeping legacy Owner Key temporarily"
          fi

          namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="taiwan-mlb-observation-list") | .id' | head -1)
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            npx wrangler kv namespace create taiwan-mlb-observation-list
            namespace_id=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="taiwan-mlb-observation-list") | .id' | head -1)
          fi
          test -n "$namespace_id" && test "$namespace_id" != "null" || { echo "::error::Could not resolve KV namespace"; exit 1; }

          # Production KV is the editable watchlist. Preserve everything already there,
          # but merge in any baseline player IDs added to tracked-players.json.
          if ! npx wrangler kv key get --namespace-id "$namespace_id" players --text --remote >/tmp/current-players.json 2>/dev/null || ! jq -e 'type == "array"' /tmp/current-players.json >/dev/null 2>&1; then
            cp tracked-players.json /tmp/merged-players.json
          else
            jq -s '
              (.[0] // []) as $current |
              (.[1] // []) as $baseline |
              reduce $baseline[] as $p ($current;
                if any(.[]; (.id|tonumber) == ($p.id|tonumber)) then . else . + [$p] end
              )
            ' /tmp/current-players.json tracked-players.json >/tmp/merged-players.json
          fi
          jq -e 'type == "array" and length > 0' /tmp/merged-players.json >/dev/null
          npx wrangler kv key put --namespace-id "$namespace_id" players --path /tmp/merged-players.json --remote
          echo "Production watchlist merged with tracked baseline: $(jq length /tmp/merged-players.json) players"

          cat > wrangler.observation.toml <<EOF
          name = "taiwan-mlb-observation-list"
          main = "cloudflare/observation-worker-safe.js"
          compatibility_date = "2026-08-12"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true

          [[kv_namespaces]]
          binding = "OBSERVATION_LIST"
          id = "$namespace_id"

          [triggers]
          crons = []
          EOF

          cat > wrangler.line-clear.toml <<EOF
          name = "taiwan-mlb-line-notifier"
          main = "cloudflare/line-worker-single-cron.js"
          compatibility_date = "2026-08-12"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true

          [[kv_namespaces]]
          binding = "OBSERVATION_LIST"
          id = "$namespace_id"
          EOF

          cat > wrangler.line.toml <<EOF
          name = "taiwan-mlb-line-notifier"
          main = "cloudflare/line-worker-single-cron.js"
          compatibility_date = "2026-08-12"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true

          [[kv_namespaces]]
          binding = "OBSERVATION_LIST"
          id = "$namespace_id"

          [triggers]
          crons = ["0 0,1,4,23 * * *"]
          EOF

          npx wrangler deploy --config wrangler.observation.toml
          npx wrangler deploy --config wrangler.line-clear.toml
          sleep 2
          npx wrangler deploy --config wrangler.line.toml
      - name: Install LINE secrets in notifier Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION: ${{ secrets.LINE_DESTINATION_ID || secrets.LINE_USER_ID }}
          DEPLOY_TEST_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$LINE_TOKEN" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --config wrangler.line.toml
          printf '%s' "$LINE_DESTINATION" | npx wrangler secret put LINE_DESTINATION_ID --config wrangler.line.toml
          printf '%s' "$DEPLOY_TEST_TOKEN" | npx wrangler secret put DEPLOY_TEST_TOKEN --config wrangler.line.toml
      - name: Verify Worker health
        id: workers
        run: |
          observation_url="https://taiwan-mlb-observation-list.jonwang329.workers.dev"
          line_url="https://taiwan-mlb-line-notifier.jonwang329.workers.dev"
          echo "observation_url=$observation_url" >> "$GITHUB_OUTPUT"
          echo "line_url=$line_url" >> "$GITHUB_OUTPUT"

          curl -fsS "$observation_url/health" | jq -e '.ok == true'

          health=""
          for attempt in $(seq 1 15); do
            health=$(curl -fsS "$line_url/health" || true)
            if echo "$health" | jq -e '.ok == true and .lineScheduler == true and .lineConfigured == true and .format == "flex-v1" and .source == "cloudflare-official"' >/dev/null 2>&1; then
              echo "LINE Flex Worker ready on attempt $attempt"
              echo "$health" | jq '{ok,lineScheduler,lineConfigured,format,source,cronTimezone}'
              exit 0
            fi
            sleep 2
          done
          echo "::error::LINE Flex Worker did not report readiness"
          echo "$health"
          exit 1
      - name: Verify LINE worker without sending a message
        env:
          URL: ${{ steps.workers.outputs.line_url }}
        run: |
          health=$(curl -fsS "$URL/health")
          echo "$health" | jq -e '.ok == true and .lineScheduler == true and .lineConfigured == true and .format == "flex-v1"'
          echo "Cloudflare LINE Flex worker verified; no LINE test message sent during deployment"
      - name: Send one explicitly authorized LINE Flex test
        if: contains(github.event.head_commit.message, '[line-test-once]')
        env:
          URL: ${{ steps.workers.outputs.line_url }}
          DEPLOY_TEST_TOKEN: ${{ github.token }}
        run: |
          result=$(curl -fsS -X POST "$URL/internal/line-test" -H "Authorization: Bearer $DEPLOY_TEST_TOKEN")
          echo "$result" | jq -e '.ok == true and .lineStatus >= 200 and .lineStatus < 300'
          echo "One user-authorized LINE Flex test sent"
      - name: Configure dashboard API URL
        env:
          URL: ${{ steps.workers.outputs.observation_url }}
        run: |
          printf "// Generated by Deploy observation Worker.\nwindow.OBSERVATION_API_URL = '%s';\n" "$URL" > observation-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observation-config.js
          if git diff --cached --quiet; then
            echo "Dashboard API URL already current"
          else
            git commit -m "Configure deployed observation Worker URL"
            git push origin HEAD:main
          fi
      - name: Verify shared list and schedules
        env:
          OBSERVATION_URL: ${{ steps.workers.outputs.observation_url }}
        run: |
          curl -fsS "$OBSERVATION_URL/players" | jq -e '.players | length > 0'
          echo "Observation API: $OBSERVATION_URL"
          echo "Legacy observation cron: explicitly disabled"
          echo "LINE scheduler: one Cloudflare cron covering 07:00, 08:00, 09:00, 12:00 Asia/Taipei"
