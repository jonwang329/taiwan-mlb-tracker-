name: Refresh dashboard snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/dashboard-snapshot.js'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-snapshot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build latest dashboard snapshot
        env:
          OBSERVATION_API_URL: https://taiwan-mlb-observation-list.jonwang329.workers.dev
        run: node scripts/build-dashboard-snapshot.mjs
      - name: Commit data only when changed
        run: |
          if git diff --quiet -- data/dashboard-snapshot.js; then
            echo 'No dashboard data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard-snapshot.js
          git commit -m 'Refresh dashboard snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
