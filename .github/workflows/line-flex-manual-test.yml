name: LINE Flex manual TEST

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Branch/ref containing the LINE formatter to test'
        required: true
        default: 'fix/line-flex-test-20260816'
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected TEST ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}

      - name: Load observation API URL
        run: |
          api_url=$(sed -n "s/.*OBSERVATION_API_URL = '\(.*\)';.*/\1/p" observation-config.js | head -1)
          if [ -n "$api_url" ]; then
            echo "OBSERVATION_API_URL=$api_url" >> "$GITHUB_ENV"
          fi

      - name: Verify LINE configuration
        env:
          HAS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' }}
          HAS_DESTINATION: ${{ secrets.LINE_DESTINATION_ID != '' || secrets.LINE_USER_ID != '' }}
        run: |
          [[ "$HAS_TOKEN" == "true" ]] || { echo "::error::LINE_CHANNEL_ACCESS_TOKEN missing"; exit 1; }
          [[ "$HAS_DESTINATION" == "true" ]] || { echo "::error::LINE destination missing"; exit 1; }

      - name: Send one TEST message only
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION_ID: ${{ secrets.LINE_DESTINATION_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-update.mjs --mode=final --test
