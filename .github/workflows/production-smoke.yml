name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed dashboard and production workers
        shell: bash
        run: |
          set -euo pipefail
          dashboard='https://jonwang329.github.io/taiwan-mlb-tracker-/'
          observation='https://taiwan-mlb-observation-list.jonwang329.workers.dev'
          line='https://taiwan-mlb-line-notifier.jonwang329.workers.dev'
          expected_refresh_guard='refresh-terminal-state-fix.js?v=20260830-observer-loop-fix-v2'

          html=''
          for attempt in $(seq 1 18); do
            html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${dashboard}?smoke=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$html" | grep -q "$expected_refresh_guard"; then
              break
            fi
            echo "Waiting for expected production dashboard version (attempt $attempt)"
            sleep 5
          done

          test -n "$html" || { echo '::error::Production dashboard returned no HTML'; exit 1; }
          printf '%s' "$html" | grep -q "$expected_refresh_guard" || { echo '::error::Expected stable refresh guard is not deployed'; exit 1; }
          if printf '%s' "$html" | grep -q 'gameday-universe-hotfix.js'; then
            echo '::error::Browser-wide Gameday universe scan is still loaded in production'
            exit 1
          fi
          printf '%s' "$html" | grep -q 'data/dashboard-snapshot.js' || { echo '::error::Central dashboard snapshot is not loaded'; exit 1; }
          printf '%s' "$html" | grep -q 'mlb-fetch-guard.js' || { echo '::error::MLB fetch guard is not loaded'; exit 1; }
          echo 'Dashboard production HTML: OK'

          observation_health=$(curl -fsSL --max-time 20 "$observation/health")
          echo "$observation_health" | jq -e '.ok == true' >/dev/null
          players=$(curl -fsSL --max-time 20 "$observation/players")
          echo "$players" | jq -e '.players | type == "array" and length > 0' >/dev/null
          echo "Observation Worker: OK ($(echo "$players" | jq '.players | length') players)"

          line_health=$(curl -fsSL --max-time 20 "$line/health")
          echo "$line_health" | jq -e '.ok == true and .lineScheduler == true and .lineConfigured == true and .format == "flex-v1" and .source == "cloudflare-official"' >/dev/null
          echo "$line_health" | jq '{ok,lineScheduler,lineConfigured,format,source,cronTimezone}'
          echo 'LINE production Worker: OK'
