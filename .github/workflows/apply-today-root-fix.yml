name: Apply Today root fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-today-root-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply root model fix
        shell: python
        run: |
          from pathlib import Path
          app=Path('app.js'); text=app.read_text()
          anchor="function confirmedAppearance(p,today){return Boolean(today?.scheduled||today?.onGame||liveAppearance(p,today?.stat||{}));}\n"
          helper=anchor+"""function todayPhase(p,today){\n  if(!today||day(today.date)!==twToday())return 0;\n  if(liveAppearance(p,today.stat||{})||today.onGame)return 4;\n  if(today.live)return 3;\n  if(today.scheduled)return 2;\n  return 1;\n}\nfunction inningsOuts(value){const parts=String(value??'0').split('.'),whole=Number(parts[0]||0),rem=Number(parts[1]||0);return whole*3+(rem===1||rem===2?rem:0);}\nfunction todayProgress(p,today){const s=today?.stat||{};if(p.group==='pitching'){const bf=num(s.battersFaced),pitches=num(s.pitchesThrown||s.numberOfPitches),outs=inningsOuts(s.inningsPitched);return Math.max(bf,outs)*1000+pitches;}const pa=num(s.plateAppearances),derived=num(s.atBats)+num(s.baseOnBalls)+num(s.hitByPitch)+num(s.sacFlies)+num(s.sacBunts);return Math.max(pa,derived)*1000+num(s.hits)+num(s.runs)+num(s.rbi);}\nfunction preferToday(p,incoming,previous){const incomingPhase=todayPhase(p,incoming),previousPhase=todayPhase(p,previous);if(previousPhase<2)return incoming;if(incomingPhase<previousPhase)return previous;if(incomingPhase>previousPhase)return incoming;if(incomingPhase>=4&&todayProgress(p,incoming)<todayProgress(p,previous))return previous;return incoming;}\n"""
          if 'function preferToday(' not in text: text=text.replace(anchor,helper,1)
          old="""      if(!entry.result.today&&previous?.today&&twToday(new Date(lastSuccessAt||Date.now()))===twToday()&&confirmedAppearance(players[i],previous.today))return {...entry.result,today:previous.today};\n      return entry.result;"""
          new="""      const preferredToday=preferToday(players[i],entry.result.today,previous?.today);\n      return preferredToday===entry.result.today?entry.result:{...entry.result,today:preferredToday};"""
          if old in text: text=text.replace(old,new,1)
          app.write_text(text)
          Path('gameday-universe-hotfix.js').write_text("""(() => {\n  // Compatibility bridge only. There is exactly one refresh/write path: app.js refreshData().\n  // This file must not fetch MLB independently, mutate Today state, paint the DOM,\n  // persist snapshots, start timers, or run an automatic startup scan.\n  async function scan({ force = false } = {}) {\n    if (typeof refreshData !== 'function') return { skipped: true, reason: 'app-model-not-ready' };\n    const results = await refreshData({ reason: force ? 'gameday-force' : 'gameday' });\n    window.dispatchEvent(new CustomEvent('tracker:gameday-universe', { detail: { singleWriter: true, refreshed: true } }));\n    return { singleWriter: true, refreshed: true, results };\n  }\n  window.TaiwanMlbUniverseScan = scan;\n})();\n""")
          p=Path('index.html'); p.write_text(p.read_text().replace('app.js?v=20260903-single-authority-v2','app.js?v=20260907-today-monotonic-v1'))
          note="""\n## 2026-09-07 Today monotonic state root-cause fix\n- Root cause: `app.js collectResults()` only protected a confirmed Today state when the fresh result had `today == null`; a later non-null but weaker scheduled/partial state could overwrite a confirmed appearance.\n- Fix: Today precedence now lives in the single authoritative `app.js` model. Same-day state cannot regress from appearance to scheduled/partial, and lower-progress appearance data cannot replace higher-progress data. Equal-progress fresh data may advance LIVE to final.\n- No player-name or player-ID exceptions are used. `gameday-universe-hotfix.js` is compatibility-only.\n"""
          for name in ('README.md','PROJECT_STATE.md','AGENTS.md'):
            p=Path(name); s=p.read_text()
            if '## 2026-09-07 Today monotonic state root-cause fix' not in s: p.write_text(s.rstrip()+"\n"+note)

      - name: Test root model fix
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gameday-universe-hotfix.js
          grep -Fq 'function preferToday(' app.js
          grep -Fq 'preferredToday=preferToday(players[i],entry.result.today,previous?.today)' app.js
          ! grep -Fq 'CENTRAL_DASHBOARD_SNAPSHOT' gameday-universe-hotfix.js
          ! grep -Fq 'persistSnapshot' gameday-universe-hotfix.js

      - name: Commit root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js gameday-universe-hotfix.js index.html README.md PROJECT_STATE.md AGENTS.md
          git commit -m 'Fix Today state regression in authoritative app model'
          git push origin HEAD:main
