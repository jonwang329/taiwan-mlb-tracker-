name: Deploy LINE notifier Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-line-notifier
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy production LINE notifier
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare/line-worker-single-cron.js --name taiwan-mlb-line-notifier --compatibility-date 2026-08-12 --triggers "0 0,1,4,23 * * *"
