name: PR LINE content retest

on:
  pull_request:
    paths:
      - '.github/workflows/pr-line-content-test-2.yml'

permissions:
  contents: read

jobs:
  test-line:
    if: github.event.pull_request.number == 37
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load observation API URL
        run: |
          api_url=$(sed -n "s/.*OBSERVATION_API_URL = '\(.*\)';.*/\1/p" observation-config.js | head -1)
          if [ -n "$api_url" ]; then
            echo "OBSERVATION_API_URL=$api_url" >> "$GITHUB_ENV"
          fi
      - name: Restore last successful official snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/line-tracker-state.json
          key: line-pr-content-retest-${{ github.run_id }}
          restore-keys: line-tracker-state-
      - name: Send latest today-only TEST message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DESTINATION_ID: ${{ secrets.LINE_DESTINATION_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-update.mjs --mode=final --test
