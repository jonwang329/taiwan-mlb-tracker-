<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#071d36">
  <title>台灣旅美球員追蹤</title>
  <link rel="stylesheet" href="styles.css?v=20260812-systemfix">
  <link rel="stylesheet" href="refresh-button.css?v=20260819-v1">
  <link rel="stylesheet" href="summary-extra-stats.css?v=20260830-league-context-v2">
  <link rel="stylesheet" href="today-highlight.css?v=20260824-reliever-v3">
  <link rel="stylesheet" href="smart-insight.css?v=20260814-insight-v2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#today" aria-label="回到今日總覽"><b>TW</b><span>TAIWAN<br>BASEBALL TRACKER</span></a>
    <div class="header-date"><strong id="today-date">—</strong><span>台灣時間</span></div>
    <button id="refresh-btn" type="button" aria-label="更新資料">↻ <span>更新</span></button>
  </header>

  <main>
    <section class="scoreboard" id="today">
      <div class="eyebrow">TODAY</div>
      <div class="scoreboard-title"><div><h1>今日台灣球員</h1><p>旅美球員即時戰況</p></div><strong id="live-status"><i></i> 即時資料</strong></div>
      <div class="score-strip" aria-label="今日數據摘要">
        <div><b id="player-count">—</b><span>追蹤球員</span></div>
        <div><b id="today-count">—</b><span>今日出賽</span></div>
        <div><b id="highlight-count">—</b><span>焦點表現</span></div>
        <div class="legacy-total" aria-hidden="true"><b id="daily-total">—</b><span>安打 / 三振</span></div>
      </div>
    </section>

    <section id="today-highlight" class="today-highlight" aria-live="polite" hidden></section>

    <section class="summary-section" aria-labelledby="summary-title">
      <div class="section-title"><div><span>QUICK SCOREBOARD</span><h2 id="summary-title">球員即時總覽</h2></div><div class="summary-tools"><small id="last-update">讀取中…</small><button id="manage-players-btn" class="manage-players" type="button">Manage <b>＋</b></button></div></div>
      <div id="player-summary" class="summary-list" aria-live="polite"></div>
    </section>

    <section class="details-section" id="players" aria-labelledby="details-title">
      <div class="section-title"><div><span>PLAYER DETAILS</span><h2 id="details-title">個別球員詳細資料</h2></div></div>
      <div id="player-details" class="details-list"></div>
    </section>
  </main>
  <footer>資料來源：MLB / MiLB Stats API</footer>

  <div id="watchlist-modal" class="watchlist-modal" hidden>
    <section class="watchlist-sheet" role="dialog" aria-modal="true" aria-labelledby="watchlist-title">
      <header><div><span>OBSERVATION LIST</span><h2 id="watchlist-title">管理觀察名單</h2><p>只有 Owner 可以加入或移除；其他訪客只能查看。</p></div><button id="watchlist-close" type="button" aria-label="關閉">×</button></header>
      <form id="player-search-form" class="player-search-box" role="search"><span>⌕</span><input id="player-search" type="search" autocomplete="off" enterkeyhint="search" placeholder="輸入中文、英文姓名、姓氏片段或 MLB ID" aria-label="搜尋 MLB 或 MiLB 現役球員"><button id="player-search-button" type="submit">搜尋</button></form>
      <p id="watchlist-status" class="watchlist-status" aria-live="polite"></p>
      <div id="player-search-results" class="player-search-results"></div>
      <div class="watchlist-divider"><span>目前追蹤</span></div>
      <div id="watchlist-current" class="watchlist-current"></div>
      <p class="watchlist-note">搜尋不受台灣球員名單限制；英文片段會查 MLB / MiLB 現役球員目錄，中文身份表只用於名稱對照與顯示。</p>
    </section>
  </div>

  <script>document.write('<script src="data/dashboard-snapshot.js?_='+Date.now()+'"><\/script>');</script>
  <script src="data/league-benchmarks.js?v=20260830-league-context-v1"></script>
  <script>window.dispatchEvent(new Event('tracker:league-benchmarks-loaded'));</script>
  <script src="player-identities.js?v=20260819-identities-v4"></script>
  <script src="snapshot-bootstrap.js?v=20260828-roster-repair-v3"></script>
  <script src="observation-config.js?v=20260816-p0"></script>
  <script src="observation-name-adapter.js?v=20260813-identities-v2"></script>
  <script src="taiwan-game-time.js?v=20260816-p0"></script>
  <script src="today-date-integrity-guard.js?v=20260827-v1"></script>
  <script src="mlb-fetch-guard.js?v=20260821-proxy-v3"></script>
  <script src="app.js?v=20260821-confirm-first-v2"></script>
  <script src="official-today-hotfix.js?v=20260817-team-authoritative-v1"></script>
  <script src="live-refresh.js?v=20260828-light-reconcile-v1"></script>
  <script src="gameday-presence-hotfix.js?v=20260819-live-presence-v1"></script>
  <script src="single-source-status-hotfix.js?v=20260824-refresh-v2"></script>
  <script src="today-gamepk-date-guard.js?v=20260827-v1"></script>
  <script src="team-schedule-visual.js?v=20260822-v1"></script>
  <script src="refresh-terminal-state-fix.js?v=20260829-airport-stability-v1"></script>
  <script src="summary-extra-stats.js?v=20260830-league-context-v2"></script>
  <script src="smart-insight.js?v=20260817-live-v2"></script>
  <script src="watchlist-fast-feedback.js?v=20260814-fast-v2"></script>
  <script src="today-highlight.js?v=20260824-carousel-v3"></script>
  <script src="watchlist-state-sync.js?v=20260814-state-v2"></script>
  <script src="watchlist-manager.js?v=20260813-manage-v4"></script>
</body>
</html>
